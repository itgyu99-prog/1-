function displayLanguage(){return $('rankingScreen').classList.contains('active')?rankLanguage:language}
function t(key,values={}){return COPY[key][['ko','en','ja'].indexOf(displayLanguage())].replace(/\{(\w+)\}/g,(_,name)=>values[name]??'')}
function applyLanguage(){
  document.documentElement.lang=displayLanguage();
  document.title=t('title');
  document.querySelector('meta[name="description"]').content=t('seoSummary');
  for(const e of document.querySelectorAll('[data-copy]'))e.textContent=t(e.dataset.copy);
  for(const picker of document.querySelectorAll('.language-picker'))picker.setAttribute('aria-label',t('languages'));
  for(const b of document.querySelectorAll('.language-picker button')){
    const selected=b.dataset.language===(b.closest('#rankLanguage')?rankLanguage:language);
    b.classList.toggle('selected',selected);
    b.setAttribute('aria-pressed',selected);
  }
  for(const b of document.querySelectorAll('#modeCards button,#rankDifficulty button')){
    const mode=MODES[b.dataset.difficulty];
    if(b.closest('#rankDifficulty')){b.textContent=t(mode.name)+' · '+mode.count;continue}
    b.querySelector('strong').textContent=t(mode.name);
    b.querySelector('.number').textContent=mode.count;
  }
  $('newNickname').placeholder=t('placeholder');
  $('newNickname').setAttribute('aria-label',t('nickname'));
  updateAccount();
}
for(const b of document.querySelectorAll('.language-picker:not(#rankLanguage) button')){

    language=b.dataset.language;
    rankLanguage=language;
    localStorage.setItem('oneilh_language_v1',language);
    if($('rankingScreen').classList.contains('active'))showRanks();
    applyLanguage();
  };
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function readScores(){try{let data=JSON.parse(localStorage.getItem('numberTileScores')||'[]');return Array.isArray(data)?data.map(s=>({...s,difficulty:s.difficulty||'beginner',language:s.language||'ko',score:Number.isFinite(Number(s.score))?Number(s.score):40})):[]}catch{return []}}
let scores=readScores(),difficulty='beginner',rankDifficulty='beginner',rankScope='daily',rankOrigin='homeScreen';let next=1,errors=0,lockedUntil=0,gameId=0,active=false,startedAt=0,timer=null,finalTime=null,recorded=false,rankRequest=0;

function best(){const completed=scores.filter(x=>x.difficulty===difficulty&&(x.language||'ko')===language&&x.score===MODES[difficulty].count&&Number.isFinite(Number(x.time)));$('best').textContent=completed.length?t('seconds',{n:Math.min(...completed.map(x=>x.time)).toFixed(2)}):'—'}
function prepare(){gameId++;clearInterval(timer);active=false;next=1;errors=0;lockedUntil=0;finalTime=null;recorded=false;const m=MODES[difficulty];$('next').textContent='1';$('time').textContent='00:00';$('errors').textContent='0';$('fill').style.width='0%';$('difficultyPill').textContent=t(m.name);$('message').textContent=t('findFirst');$('message').classList.remove('error');best();const board=$('board');board.replaceChildren();board.style.setProperty('--cols',m.cols);board.style.setProperty('--rows',m.rows);for(const n of shuffle(Array.from({length:m.count},(_,i)=>i+1))){const b=document.createElement('button');b.className='tile';b.type='button';b.textContent=tileText(n,language);if(b.textContent.length>9)b.classList.add('long-text');b.setAttribute('translate','no');b.setAttribute('aria-label',b.textContent);b.onclick=()=>tap(b,n);board.append(b)}}

async function showRanks(){const req=++rankRequest;$('rankContent').innerHTML=emptyRank('loading');$('rankNote').textContent='';try{const view=rankScope==='daily'?'oneilh_daily_ranking':'oneilh_public_ranking';const params=new URLSearchParams({select:'nickname,time,score,errors,difficulty',difficulty:`eq.${rankDifficulty}`,language:`eq.${rankLanguage}`,score:'eq.'+MODES[rankDifficulty].count,order:'time.asc,errors.asc',limit:'100'});const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/${view}?${params}`,{headers:{apikey:CONFIG.supabaseAnonKey}});if(!r.ok)throw new Error('서버 오류 '+r.status);const data=await r.json();if(req!==rankRequest)return;renderRanks(data.sort(compareScores).slice(0,100));$('rankNote').textContent=rankScope==='daily'?t('dailyNote'):t('allNote')}catch(e){if(req!==rankRequest)return;$('rankContent').innerHTML=emptyRank('rankError');$('rankNote').textContent=''}}

async function rpc(name,body){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:CONFIG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const raw=await r.text();if(!r.ok){let message=raw;try{const x=JSON.parse(raw);message=x.message||raw}catch{}throw new Error(message)}try{return JSON.parse(raw)}catch{return raw}}finally{clearTimeout(timeout)}}
$('accountBtn').onclick=()=>openAccount('homeScreen');$('accountBack').onclick=()=>switchScreen(accountOrigin);
$('claimBtn').onclick=async()=>{const nickname=$('newNickname').value.trim();if(nickname.length<2||nickname.length>16){$('claimStatus').textContent=t('invalid');return} $('claimBtn').disabled=true;$('claimStatus').textContent=t('claiming');try{await rpc('oneilh_claim_nickname',{p_nickname:nickname,p_token:token()});myNickname=nickname;localStorage.setItem(NICK_KEY,myNickname);updateAccount();$('claimStatus').textContent=t('registered');switchScreen(accountOrigin);if(accountOrigin==='resultScreen')$('saveStatus').textContent=t('canSave')}catch(e){$('claimStatus').textContent=e.message.includes('nickname_taken')?t('taken'):t('claimError')}finally{$('claimBtn').disabled=false}};
$('saveBtn').onclick=async()=>{if(finalTime===null||recorded)return;if(!myNickname){openAccount('resultScreen');return} $('saveBtn').disabled=true;$('saveStatus').textContent=t('saving');const row={nickname:myNickname,time:Number(finalTime.toFixed(2)),score:next-1,errors,difficulty,language};try{const result=await rpc('oneilh_submit_score_lang',{p_nickname:myNickname,p_token:token(),p_difficulty:difficulty,p_language:language,p_score:row.score,p_time:row.time,p_errors:row.errors});recorded=true;if(result?.updated){scores.push(row);try{localStorage.setItem('numberTileScores',JSON.stringify(scores.slice(-300)))}catch{}best();$('saveStatus').textContent=t('savedBest')}else{$('saveStatus').textContent=result?.daily_updated?t('savedDaily'):t('kept')}$('saveArea').classList.add('hidden')}catch(e){$('saveStatus').textContent=e.name==='AbortError'?t('saveTimeout'):t('saveError');$('saveBtn').disabled=false}};
for(const b of document.querySelectorAll('[data-info]'))b.onclick=()=>{
  const key=b.dataset.info;
  $('infoHeading').textContent=t(key);
  $('infoContent').textContent=t(key+'Body');
  switchScreen('infoScreen');
};
$('infoBack').onclick=()=>switchScreen(infoOrigin);
// Supabase Realtime broadcasts ranking changes; refresh only while ranking is visible.
function beginRealtime(){if(!rankPollTimer)rankPollTimer=setInterval(()=>{if($('rankingScreen').classList.contains('active'))showRanks()},10000);if(rankChannel||!window.supabase)return;rankChannel=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey).channel('oneilh-scores').on('postgres_changes',{event:'*',schema:'public',table:'oneilh_scores'},()=>{if(!$('rankingScreen').classList.contains('active')||false)return;clearTimeout(rankRefreshTimer);rankRefreshTimer=setTimeout(showRanks,400)}).subscribe();window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey).channel('oneilh-daily').on('postgres_changes',{event:'*',schema:'public',table:'oneilh_daily_scores'},()=>{if($('rankingScreen').classList.contains('active'))showRanks()}).subscribe()}
$('playBtn').onclick=start;$('backBtn').onclick=()=>{active=false;clearInterval(timer);gameId++;switchScreen('homeScreen')};$('restartBtn').onclick=start;$('againBtn').onclick=start;$('resultHomeBtn').onclick=()=>switchScreen('homeScreen');$('homeRankBtn').onclick=()=>openRanks('homeScreen');$('resultRankBtn').onclick=()=>openRanks('resultScreen');$('rankBackBtn').onclick=()=>{rankRequest++;switchScreen(rankOrigin);applyLanguage()};
applyLanguage();
setDifficulty(difficulty);
if(localStorage.getItem(guideDayKey)!==localDay())guide.showModal();
